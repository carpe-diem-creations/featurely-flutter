name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Show and discard files modified by the toolchain
        run: |
          git status --porcelain
          git diff
          git checkout -- .

      - name: Publish dry-run
        run: flutter pub publish --dry-run

  # Inlined instead of calling dart-lang/setup-dart's reusable publish
  # workflow: that workflow grants its job only `id-token: write`, so its
  # checkout cannot read a private repository.
  publish:
    name: Publish to pub.dev
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC-based authentication with pub.dev
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Sets up the Dart SDK and provisions the OIDC token used for
      # publishing; the `dart`/`pub` commands are then shadowed by the
      # Flutter SDK below, which shares the same pub token store.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Discard files modified by the toolchain
        run: git checkout -- .

      - name: Publish
        run: flutter pub publish --force
